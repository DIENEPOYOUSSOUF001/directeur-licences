<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>GMI — Gestion des licences</title>
<style>
:root{color-scheme:dark;--bg:#0b1f3a;--card:#102a4c;--txt:#e6eefc;--mut:#9db3d3;--ok:#1e8e4e;--warn:#d69e1a;--ko:#b23a3a;--acc:#00c8ff}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,Arial;background:var(--bg);color:var(--txt)}
header{padding:18px 24px;border-bottom:2px solid var(--acc);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:20px}main{padding:20px 24px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.stat{background:var(--card);padding:10px 16px;border-radius:8px}
.stat b{display:block;font-size:22px}
input,button{font:inherit;padding:7px 10px;border-radius:6px;border:1px solid #2c4a78;background:#0e2444;color:var(--txt)}
button{cursor:pointer;background:#17407a}button:hover{background:#1d5199}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:8px;overflow:hidden}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #1d3a66;white-space:nowrap}th{color:var(--mut);font-weight:600}
.badge{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.ESSAI{background:var(--warn)}.ACTIVE{background:var(--ok)}.EXPIREE{background:#6b7280}.REVOQUEE{background:var(--ko)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#6b7280}.dot.on{background:#3ddc84}
.wrap{overflow-x:auto}
</style></head><body>
<header><h1>GMI — Gestion des licences DIRECTEUR</h1>
<input id="q" placeholder="Rechercher (machine, poste, n° licence)…" size="34"><button id="rf">Actualiser</button><span id="msg" style="color:var(--mut)"></span></header>
<main><div class="stats" id="stats"></div><div class="wrap"><table><thead><tr>
<th>En ligne</th><th>Machine</th><th>Poste</th><th>Statut</th><th>Temps restant</th><th>Expire le</th><th>Licence</th><th>Dernière vue</th><th>Première vue</th><th>Action</th>
</tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
let KEY=sessionStorage.getItem('gmi_admin')||prompt('Clé administrateur GMI :')||'';sessionStorage.setItem('gmi_admin',KEY);
let DATA=[];const $=id=>document.getElementById(id);
const fmtReste=r=>{if(r.statut==='ACTIVE')return r.expire?'':'';if(r.statut==='ESSAI'){const s=r.reste|0;return Math.floor(s/3600)+' h '+String(Math.floor(s%3600/60)).padStart(2,'0')+' min'}return '—'};
const jours=r=>{if(r.statut!=='ACTIVE'||!r.expire)return null;return Math.ceil((new Date(r.expire)-Date.now())/864e5)};
const dt=s=>s?new Date(s).toLocaleString('fr-FR'):'—';
function td(tr,txt,cls){const c=document.createElement('td');if(cls)c.className=cls;c.textContent=txt;tr.appendChild(c);return c}
function render(){
 const q=$('q').value.toLowerCase();const body=$('rows');body.textContent='';
 let cnt={ESSAI:0,ACTIVE:0,EXPIREE:0,REVOQUEE:0},on=0;
 DATA.sort((a,b)=>b.derniere_vue.localeCompare(a.derniere_vue)).forEach(r=>{
  const st=r.revoque?'REVOQUEE':r.statut;cnt[st]=(cnt[st]||0)+1;const online=Date.now()-new Date(r.derniere_vue)<20*60e3;if(online)on++;
  if(q&&![r.machine,r.poste,r.licence].join(' ').toLowerCase().includes(q))return;
  const tr=document.createElement('tr');
  const c0=td(tr,'');const d=document.createElement('span');d.className='dot'+(online?' on':'');c0.appendChild(d);c0.appendChild(document.createTextNode(online?'oui':'non'));
  td(tr,r.machine);td(tr,r.poste||'—');
  const cs=td(tr,'');const b=document.createElement('span');b.className='badge '+st;b.textContent=st;cs.appendChild(b);
  const j=jours(r);td(tr,st==='ACTIVE'?(j===null?'—':(j+' jour(s)')):fmtReste(r));
  td(tr,r.expire||'—');td(tr,r.licence||'—');td(tr,dt(r.derniere_vue));td(tr,dt(r.premiere_vue));
  const ca=td(tr,'');const btn=document.createElement('button');btn.textContent=r.revoque?'Rétablir':'Suspendre';
  btn.onclick=()=>act(r.machine,r.revoque?'retablir':'revoquer');ca.appendChild(btn);body.appendChild(tr);
 });
 $('stats').textContent='';
 [['Machines',DATA.length],['En ligne (20 min)',on],['Essai',cnt.ESSAI],['Actives',cnt.ACTIVE],['Expirées',cnt.EXPIREE],['Suspendues',cnt.REVOQUEE]].forEach(([k,v])=>{
  const s=document.createElement('div');s.className='stat';const n=document.createElement('b');n.textContent=v;s.appendChild(n);s.appendChild(document.createTextNode(k));$('stats').appendChild(s)});
}
async function load(){$('msg').textContent='Chargement…';
 const r=await fetch('/.netlify/functions/licence',{headers:{'x-admin-key':KEY}});
 if(r.status===401){$('msg').textContent='Clé administrateur incorrecte';sessionStorage.removeItem('gmi_admin');return}
 DATA=await r.json();$('msg').textContent='Mis à jour '+new Date().toLocaleTimeString('fr-FR');render()}
async function act(machine,action){if(!confirm((action==='revoquer'?'Suspendre':'Rétablir')+' la licence de '+machine+' ?'))return;
 await fetch('/.netlify/functions/licence',{method:'POST',headers:{'x-admin-key':KEY,'content-type':'application/json'},body:JSON.stringify({action,machine})});load()}
$('rf').onclick=load;$('q').oninput=render;load();setInterval(load,60000);
</script></body></html>
